[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Do NOT set VITE_ADMIN_AUTH_ENABLED here. netlify.toml overrides Netlify UI env vars
  # for the same key, so a hardcoded "false" would keep staff login disabled even after
  # the owner sets VITE_ADMIN_AUTH_ENABLED=true in the UI.
  # Default-off: unset VITE_* is still false in isAdminAuthUiEnabled() (exact "true" only).
  # Set these in the Netlify UI (Site environment variables), Builds + Functions scopes:
  #   ADMIN_AUTH_ENABLED=true
  #   VITE_ADMIN_AUTH_ENABLED=true
  #   ADMIN_EMAIL_ALLOWLIST=stellaroskens@gmail.com
  # Then trigger a new production deploy so Vite can inline the client flag.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# CDN role gates. Fallbacks send unauthorized visitors to staff login.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
  conditions = { Role = ["super_admin"] }

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200
  conditions = { Role = ["super_admin"] }

[[redirects]]
  from = "/admin"
  to = "/staff/login"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "/staff/login"
  status = 302

[[redirects]]
  from = "/coach"
  to = "/index.html"
  status = 200
  conditions = { Role = ["coach", "super_admin"] }

[[redirects]]
  from = "/coach/*"
  to = "/index.html"
  status = 200
  conditions = { Role = ["coach", "super_admin"] }

[[redirects]]
  from = "/coach"
  to = "/staff/login"
  status = 302

[[redirects]]
  from = "/coach/*"
  to = "/staff/login"
  status = 302

[[redirects]]
  from = "/team-administrator"
  to = "/index.html"
  status = 200
  conditions = { Role = ["team_administrator", "super_admin"] }

[[redirects]]
  from = "/team-administrator/*"
  to = "/index.html"
  status = 200
  conditions = { Role = ["team_administrator", "super_admin"] }

[[redirects]]
  from = "/team-administrator"
  to = "/staff/login"
  status = 302

[[redirects]]
  from = "/team-administrator/*"
  to = "/staff/login"
  status = 302

# React Router handles every route in the browser, so unknown paths must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Response headers live in public/_headers so drag-and-drop deploys of dist/ ship them too.
# Defining them here as well would send duplicate values on Git-based deploys.
